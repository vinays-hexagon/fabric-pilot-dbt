version: 2

models:
  - name: dim_customers
    description: "Customer dimension enriched with organizational hierarchy."
    columns:
      - name: customer_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Orders fact table with customer and org dimensions resolved."
    columns:
      - name: order_id
        description: "Primary key."
        data_tests:
          - unique
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['fulfilled', 'pending', 'cancelled']
